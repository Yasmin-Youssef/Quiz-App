<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/quiz.png" type="image/png">
    <!-- Animation Css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <title>Quiz App</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="Css/all.min.css">
    <!-- Bootstrap Css -->
    <link rel="stylesheet" href="Css/bootstrap.min.css">
    <!--Css Main  -->
    <link rel="stylesheet" href="Css/style.css">
</head>

<body>
    <section class="section_Quiz pt-5 d-flex justify-content-center align-items-center">
        <div class="p-2 w-50 bg-body bg-opacity-50 rounded-3 animate__animated animate__backInLeft">
            <div class="text-center mb-3">
                <div class="text-center mt-5 p-2 d-inline-block m-auto bg_Animation rounded-4">
                    <h1 class=" m-0 bg-light d-inline-block  py-3 px-4 rounded-3 "><img src="img/quiz.png" height="40px"
                            width="40px" alt="Quiz"> Quiz App</h1>
                </div>
            </div>

            <form action="" class="" id="Quiz_form">
                <label for="selectCategory" class="fs-5 ms-3">Select Category:</label>
                <select id="selectCategory" name="trivia_category" class="form-select mb-3">
                    <option value="any">Select Category:</option>
                    <option value="9">General Knowledge</option>
                    <option value="10">Entertainment: Books</option>
                    <option value="11">Entertainment: Film</option>
                    <option value="12">Entertainment: Music</option>
                    <option value="13">Entertainment: Musicals &amp; Theatres</option>
                    <option value="14">Entertainment: Television</option>
                    <option value="15">Entertainment: Video Games</option>
                    <option value="16">Entertainment: Board Games</option>
                    <option value="17">Science &amp; Nature</option>
                    <option value="18">Science: Computers</option>
                    <option value="19">Science: Mathematics</option>
                    <option value="20">Mythology</option>
                    <option value="21">Sports</option>
                    <option value="22">Geography</option>
                    <option value="23">History</option>
                    <option value="24">Politics</option>
                    <option value="25">Art</option>
                    <option value="26">Celebrities</option>
                    <option value="27">Animals</option>
                    <option value="28">Vehicles</option>
                    <option value="29">Entertainment: Comics</option>
                    <option value="30">Science: Gadgets</option>
                    <option value="31">Entertainment: Japanese Anime &amp; Manga</option>
                    <option value="32">Entertainment: Cartoon &amp; Animations</option>
                </select>

                <label for="selectDifficulty" class="ms-3 fs-5">Select Difficulty:</label>
                <select id="selectDifficulty" name="trivia_difficulty" class="form-select">
                    <option value="any">Select Difficulty:</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <label class="ms-3 fs-5" for="numberQuestions">Number of Questions:</label>
                <input id="numberQuestions" class="form-control mb-3" type="number" placeholder="Number of Questions:">
                
                <div class=" mt-3 text-center ">
                    <button id="startQuizBtn" type="button" class="btn bg_pink text-white">Start Quiz</button>
                </div>
            </form>
            <div id="question_container">
              
            </div>
        </div>
    </section>
<div class="loaderApp d-flex justify-content-center align-items-center d-none">
<div class="load"></div>
</div>



    <!-- Js Bootstrap -->
    <script src="Js/bootstrap.bundle.min.js"></script>
    <!-- JS Main -->
    <script type="module" src="Js/index.js"></script>
</body>

</html>
